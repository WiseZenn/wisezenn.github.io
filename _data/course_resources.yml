# Course resource index (data-driven rendering for /courses/)
# Fields:
# - id: stable key for a course
# - title: default display title
# - title_zh: optional Chinese display title
# - term: optional term text (e.g., 2025 Fall)
# - summary: optional short description (default language)
# - summary_zh: optional Chinese summary
# - resources[]:
#   - name: resource title
#   - name_zh: optional Chinese title
#   - type: exam | notes | review | slides | assignment | other
#   - year: optional numeric year
#   - format: pdf | docx | md | zip | etc.
#   - preview_url: optional online preview URL
#   - download_url: optional download URL
#   - backup_url: optional backup URL (e.g., OneDrive)
#   - backup_links: optional list of backup links for the three-dot menu
#       - label: backup source label (e.g., OneDrive, Netdisk)
#       - url: backup source URL
#   - updated_at: optional date string
#   - notes: optional note (default language)
#   - notes_zh: optional Chinese note

