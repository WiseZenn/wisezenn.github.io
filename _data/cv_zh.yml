    项目经历:
      - company: 仿生蝴蝶设计与制造
        position: 项目负责人
        location: ""
        start_date: 2023-08
        end_date: 2024-01
        summary: 主导仿生扑翼飞行器工程实现，完成机械结构、气动仿真与飞控系统的并行设计与联调。
        highlights:
          - 基于 Xflow 建立气动仿真流程，完成升阻特性分析并优化翼型拓扑。
          - 设计双舵机直驱扑翼机构，推进结构轻量化并完成传动可靠性验证。
          - 完成飞控参数整定与软硬件联调，实现稳定飞行及扰动下快速恢复。
          - "成果：长安大学机械创新设计大赛二等奖。"

      - company: 基于 Arduino 的磁约束平衡装置
        position: 项目负责人
        location: ""
        start_date: 2023-02
        end_date: 2023-07
        summary: 负责磁约束平衡装置总体架构设计，构建传感、驱动与控制算法闭环的工程系统。
        highlights:
          - 基于 Arduino 与电磁线圈实现非接触约束控制，完成传感与执行链路搭建。
          - 设计并整定 PID 控制器，显著提升平衡稳定性并抑制外部冲击振动。
          - 组织多轮样机迭代与测试，提升结构刚度、控制鲁棒性与系统抗干扰能力。
          - "成果：全国大学生物理实验竞赛（创新）一等奖；西北地区大学生物理实验竞赛二等奖。"

      - company: 仿生蝴蝶设计与制造
        position: 核心成员
        location: ""
        start_date: 2021-11
        end_date: 2022-11
        summary: 面向硬岩工况破岩效率问题，参与压冲耦合机构方案研发、建模分析与工程验证。
        highlights:
          - 完成 500+ 零部件刀盘系统建模，并开展关键构件受力与运动分析。
          - 优化滚刀与冲击单元布局，提升硬岩工况下静动耦合破岩效率。
          - 参与专利与项目材料撰写，支撑工程成果凝练与竞赛答辩。
          - "成果：第十三届挑战杯陕西赛区特等奖；授权实用新型专利 2 项；国家级大学生创新项目优秀结题。"

